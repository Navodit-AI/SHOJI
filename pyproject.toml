[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoji"
version = "0.1.0"
description = "Privacy firewall for LLM apps: redacts personal data before it reaches the model and restores it in the response."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Starlette's TestClient prefers httpx2; plain httpx is deprecated there.
    "httpx2>=2.16",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shoji"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
